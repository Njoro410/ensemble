name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Stub opencode for tests
        run: |
          sudo tee /usr/local/bin/opencode >/dev/null <<'EOF'
          #!/usr/bin/env bash
          if [ "${1:-}" = "--version" ]; then echo "opencode v2.3.2"; fi
          exit 0
          EOF
          sudo chmod +x /usr/local/bin/opencode

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  gui:
    name: GUI tests (GTK3, Xvfb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-gi python3-gi-cairo \
            gir1.2-gtk-3.0 xvfb

      - name: Stub opencode for tests
        run: |
          sudo tee /usr/local/bin/opencode >/dev/null <<'EOF'
          #!/usr/bin/env bash
          if [ "${1:-}" = "--version" ]; then echo "opencode v2.3.2"; fi
          exit 0
          EOF
          sudo chmod +x /usr/local/bin/opencode

      - name: Install package
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run tests including GUI
        run: .venv/bin/python -m pytest -q

      - name: GUI smoke test
        run: xvfb-run -a .venv/bin/ensemble gui --smoke-test

  deb:
    name: Build .deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev lintian python3-venv

      - name: Build package
        run: |
          python3 -m venv .build-venv
          .build-venv/bin/pip install --upgrade pip
          PYTHON=.build-venv/bin/python ./scripts/build-deb.sh

      - name: Validate package
        run: |
          dpkg-deb -I dist/ensemble_*_all.deb
          dpkg-deb -c dist/ensemble_*_all.deb
          lintian --fail-on error dist/ensemble_*_all.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ensemble-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --title "Ensemble $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
