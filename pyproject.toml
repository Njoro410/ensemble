[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble"
version = "0.1.0"
description = "Claude Code with a team of specialist models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Njoro410" }]
requires-python = ">=3.10"
keywords = ["claude-code", "opencode", "multi-agent", "llm", "gtk"]
dependencies = ["keyring>=24"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/Njoro410/ensemble"
Issues = "https://github.com/Njoro410/ensemble/issues"
Changelog = "https://github.com/Njoro410/ensemble/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ensemble = "ensemble.cli:main"
ensemble-peer = "ensemble.peer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ensemble = ["skill_template.md", "data/ensemble.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
