[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble"
version = "0.1.0"
description = "Control plane and peer protocol for multi-provider agent ensembles"
requires-python = ">=3.10"
dependencies = ["keyring>=24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ensemble = "ensemble.cli:main"
ensemble-peer = "ensemble.peer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
